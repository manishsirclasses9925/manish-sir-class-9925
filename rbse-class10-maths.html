<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBSE Class 10 Mathematics</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#123b70;color:white;padding:22px 15px;text-align:center}
header h1{margin:0;font-size:24px}
header p{margin:8px 0 0}
main{max-width:850px;margin:20px auto;padding:12px}
.panel{background:white;padding:18px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px #00000012}
.chapter{display:block;text-decoration:none;background:#fff;border:1px solid #dce4ef;
padding:15px;margin:10px 0;border-radius:9px;color:#123b70;font-weight:bold}
.chapter:hover{background:#eaf2ff}
button{border:0;background:#123b70;color:white;padding:11px 15px;border-radius:7px;cursor:pointer}
.hidden{display:none}
h2{color:#123b70}
details{background:#f3f6fb;padding:12px;border-radius:8px;margin:10px 0}
summary{cursor:pointer;font-weight:bold;color:#123b70}
.back{margin-bottom:15px}
footer{text-align:center;padding:20px;color:#667085}
</style>
</head>
<body>
<header>
<h1>Manish Sir Classes</h1>
<p>RBSE Class 10 – Mathematics</p>
</header>

<main>
<section id="chapterList" class="panel">
<h2>Mathematics – All Chapters</h2>
<p>Select a chapter to study notes, formulas and solutions.</p>
<div id="chapters"></div>
</section>

<section id="chapterContent" class="panel hidden">
<button class="back" onclick="showChapters()">← All Chapters</button>
<h2 id="chapterTitle"></h2>
<div id="chapterDetails"></div>
</section>
</main>

<footer>Manish Sir Classes | RBSE Class 10 Mathematics</footer>

<script>
const chapterNames = [
"Real Numbers",
"Polynomials",
"Pair of Linear Equations in Two Variables",
"Quadratic Equations",
"Arithmetic Progressions",
"Triangles",
"Coordinate Geometry",
"Introduction to Trigonometry",
"Some Applications of Trigonometry",
"Circles",
"Areas Related to Circles",
"Surface Areas and Volumes",
"Statistics",
"Probability"
];

const chaptersDiv = document.getElementById("chapters");

chapterNames.forEach((name,index)=>{
 const link=document.createElement("a");
 link.className="chapter";
 link.href="#chapter-"+(index+1);
 link.textContent="Chapter "+(index+1)+" – "+name;
 link.onclick=(event)=>{
   event.preventDefault();
   openChapter(index);
 };
 chaptersDiv.appendChild(link);
});

function showChapters(){
 document.getElementById("chapterList").classList.remove("hidden");
 document.getElementById("chapterContent").classList.add("hidden");
 history.replaceState(null,"",location.pathname);
}

function openChapter(index){
 const number=index+1;
 document.getElementById("chapterList").classList.add("hidden");
 document.getElementById("chapterContent").classList.remove("hidden");
 document.getElementById("chapterTitle").textContent=
 "Chapter "+number+" – "+chapterNames[index];

 let content="";

 if(number===1){
 content=`
 <h3>Short Notes</h3>
 <p>Real Numbers include rational and irrational numbers.</p>
 <p><b>Rational Numbers:</b> Numbers that can be written in the form p/q, where q is not zero.</p>
 <p><b>Irrational Numbers:</b> Numbers that cannot be written in the form p/q.</p>
 <h3>Important Formula</h3>
 <p>For two positive integers:</p>
 <p>HCF × LCM = Product of the two numbers</p>
 <h3>Example Questions</h3>
 <details>
 <summary>Question 1: Find the HCF of 12 and 18.</summary>
 <p>12 = 2 × 2 × 3</p>
 <p>18 = 2 × 3 × 3</p>
 <p>Common factors = 2 × 3</p>
 <b>HCF = 6</b>
 </details>
 <details>
 <summary>Question 2: Find the LCM of 12 and 18.</summary>
 <p>12 = 2² × 3</p>
 <p>18 = 2 × 3²</p>
 <p>LCM = 2² × 3² = 36</p>
 <b>Answer = 36</b>
 </details>
 `;
 }else{
 content=`
 <h3>Chapter Notes</h3>
 <p>Notes for ${chapterNames[index]} will be added here.</p>
 <h3>Important Formulas</h3>
 <p>Chapter-wise formulas will be provided here.</p>
 <h3>Textbook Questions and Solutions</h3>
 <p>All textbook exercise questions with step-by-step solutions will be added here after checking the prescribed RBSE textbook.</p>
 `;
 }

 document.getElementById("chapterDetails").innerHTML=content;
 history.replaceState(null,"","#chapter-"+number);
}
</script>
</body>
</html>
